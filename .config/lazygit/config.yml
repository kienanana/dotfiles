gui:
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
  showIcons: true
  mouseEvents: true
  nerdFontsVersion: "3"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  autoFetch: true
keybinding:
  universal:
    quit: q
    return: <esc>
